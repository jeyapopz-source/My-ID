name: Build Android APK

on:
  push:
    branches: [ "main" ]

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: Unzip Project
      run: |
        unzip -o "my family 3..0.zip" -d ./www

    - name: Install Cordova and Build APK
      run: |
        npm install -g cordova
        cordova create myapp com.myfamily.app MyFamily
        cp -r www/* myapp/www/
        cd myapp
        cordova platform add android
        cordova build android --no-telemetry

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: MyFamily-APK
        path: myapp/platforms/android/app/build/outputs/apk/debug/app-debug.apk
        
